@if(chatTypeInput === 'private' && chatPartnerData) {
<div class="flex flex-col gap-4 md:pl-[2.8rem] pl-[1rem] h-full justify-end">
  <div class="flex flex-row gap-5 items-end">
    <div class="h-[4.5rem] w-[4.5rem] rounded-[50%] overflow-hidden">
      <img
        class="w-full h-full"
        [src]="'img/user_' + chatPartnerData.avatarId + '.png'"
        alt=""
      />
    </div>

    <span
      class="text-24 font-[700] hover:text-[#535AF1] cursor-pointer"
      (click)="toggleClickedUserPopup()"
    >
      {{ chatPartnerData.firstName }} {{ chatPartnerData.lastName }}
    </span>
  </div>

  <span class="text-[#686868]">
    Diese Unterhaltung findet nur zwischen
    <a
      (click)="toggleClickedUserPopup()"
      class="text-[#535AF1] hover:text-[#5794df] transition-colors ease-in-out duration-200 cursor-pointer"
    >
      {{ chatPartnerData.firstName }} {{ chatPartnerData.lastName }}
    </a>
    und dir statt.
  </span>
</div>
}

<app-other-users-popup
  *ngIf="showUserPopupVisible && chatPartnerData"
  [userData]="chatPartnerData"
  (closeUserPopup)="toggleClickedUserPopup()"
  class="fixed inset-0 z-50 flex justify-center items-center"
/>
