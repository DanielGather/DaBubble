<div
  class="inputWrapper relative md:px-0 cursor-pointer"
  [ngClass]="{ 'px-4': padding }"
>
  <input
    placeholder="Devspace durchsuchen"
    type="text"
    #myInput
    (input)="onChange($event)"
  />
  <img
    class="hidden md:hidden [@media(min-width:1200px)]:block w-7 [@media(min-width:1024px)]:w-8 absolute top-2 md:top-3.5 [@media(min-width:1024px)]:top-4 right-8 md:right-12 pointer-events-none"
    src="img/search_icon.svg"
    alt=""
  />
  <app-search-dropdown [(visible)]="isModalOpen"></app-search-dropdown>
</div>
